# Конфигурация линтера и форматировщика ruff.
# Запуск:  ruff check .        — проверить
#          ruff check . --fix  — починить автоматически исправимое
#          ruff format .       — отформатировать

target-version = "py312"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle: ошибки стиля
    "W",    # pycodestyle: предупреждения
    "F",    # pyflakes: неиспользуемые импорты и переменные, опечатки в именах
    "I",    # isort: порядок импортов
    "N",    # pep8-naming: имена по соглашениям
    "UP",   # pyupgrade: устаревшие конструкции, которые уже не нужны в 3.12
    "B",    # flake8-bugbear: типичные ловушки (например, изменяемый аргумент по умолчанию)
    "ANN",  # flake8-annotations: аннотации типов обязательны — требование CLAUDE.md
    "RUF",  # правила самого ruff
]

ignore = [
    "ANN401",  # разрешаем typing.Any там, где иначе никак
]

[lint.per-file-ignores]
# В тестах аннотации возвращаемого типа не требуем — они там шум.
"tests/*" = ["ANN"]

[format]
# Одинарные или двойные кавычки — выбрано двойное, как по умолчанию в ruff и black.
quote-style = "double"
